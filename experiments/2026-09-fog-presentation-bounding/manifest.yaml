headline:
  problem_signature: "Fog semantic updates were incremental, but final presentation still submitted 3,144,640 SRCALPHA pixels every frame."
  root_cause: "A full-window Fog presentation blit remained in the steady-state render path after semantic work had already become incremental."
  resolution: "Keep the semantic Surface unchanged and cache a map-content screen-space presentation rectangle computed during full rebuild."
  result: "Presentation pixels fell 61.06%; RenderEngine fell from 5.425 ms to 3.433 ms and queue_submit by ~2.00 ms in the comparable causal chain."

closure:
  performance_validation: passed
