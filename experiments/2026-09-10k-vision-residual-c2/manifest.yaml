interpretation:
  union_refcount:
    status: necessary_bookkeeping_candidate_for_later_data_structure_work
    note: only ~0.8-1.3 percent of refcount tile ops change faction visibility
  set_diff:
    status: material_but_semantically_useful
  explored:
    status: wrong_complexity_selected_for_c2a
    current_behavior: explored_update_full_visible_set_per_changed_unit
    selected_trigger: faction_visibility_refcount_zero_to_one

c2a:
  name: explored_history_on_faction_visibility_zero_to_one
  implementation_scope:
    - rotk_env/systems/vision_system.py
    - dedicated regression test only
  forbidden_changes:
    - refcount_representation
    - set_diff_algorithm
    - geometry_cache
    - audit_scheduling
    - movement
    - rendering
  semantic_contract:
    - bootstrap_exploration_matches_initial_faction_visibility
    - shared_refcount_increment_does_not_touch_explored
    - explored_history_never_removed_on_visibility_loss
    - reentry_preserves_history
    - faction_visibility_and_fog_journal_semantics_unchanged
    - observation_and_fog_presentation_consumers_unchanged

closeout:
  execution_order: [A50, B50, B100, A100]
  uninstrumented: true
  process_cleanup: exec_launcher_plus_captured_process_tree
  criteria:
    rate_tolerance_pct: 2.0
    faction_transition_tolerance_pct: 5.0
    min_vision_saving_us_per_changed_unit: 0.4
    max_geometry_hit_rate_drop_pp: 0.5
    max_controlled_avg_regression_pct: 2.0
    vision_avg_must_improve_both_densities: true
    controlled_avg_100pct_must_improve: true
    p99_diagnostic_not_keep_revert_gate: true
  local_metric: VisionSystem_inclusive_cpu_us_per_changed_unit
  decision_values:
    keep: CAUSALLY_CONFIRMED_KEEP
    otherwise: INCONCLUSIVE

methodology:
  rule: "先消灭错误复杂度，再重构必要复杂度"
  next_if_c2a_closes:
    - C2b faction_refcount_representation
    - C2c visibility_set_diff_if_still_material

next_action: run_c2a_same_session_closeout
