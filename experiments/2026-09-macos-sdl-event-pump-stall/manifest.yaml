    later production/movement-validation replications; no canonical raw artifact
    owned by this case

reopen_conditions:
  - long frames cease to be dominated by input_event_pump
  - input_event_get_queue or input_dispatch becomes material
  - stalls become frequent enough to affect normal 60 FPS gameplay
  - similar behavior appears on non-macOS platforms
  - SDL/Pygame runtime changes materially alter the signature
