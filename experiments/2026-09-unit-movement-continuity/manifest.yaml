runtime:
  os: macOS
  pygame: 2.6.1
  sdl: 2.28.4
  python: 3.13.12
  window: 2480x1268

workload:
  display: window
  mode: real_time
  clock_mode: fixed_step_capped
  fps_cap: 60
  map_id: river_split
  map_size: 15x15
  map_tiles: 225
  initial_units: 15
  players: "shu:ai,wei:human,wu:ai"
  scenario: default
  seed: 42
  hub: offline
  mock_ai: false
  command: >-
    uv run rotk_env/main.py --skip-start --no-hub --mode real_time
    --players human_vs_two_ai --scenario default --seed 42 --profile

observation:
  original_report: >-
    A small visible hitch appeared when a moving unit crossed Fog boundaries.
  controlled_ab:
    fog_on: boundary_micro_stutter_visible
    fog_off: same_boundary_micro_stutter_visible
    conclusion: fog_correlation_rejected

root_causes:
  - id: movement_segment_time_loss
    problem: >-
      MovementAnimation reset progress to zero at each committed segment and
      discarded overshoot. At 60 Hz and 2 tiles/s floating-point accumulation
      could also leave tick 30 at 0.9999999999999999, delaying the commit.
    fix_sha: acc77f8928933dd68f4dc57690d8ae686b06afe1
    fix: epsilon_safe_boundary_plus_overshoot_preservation_plus_multi_segment_consumption
  - id: renderer_animation_dead_zone
    problem: >-
      Rich unit rendering ignored animation displacement within 5 world pixels
      of the committed hex centre; the batch path used a 1-pixel dead zone.
      At default movement speed one frame is only about 2.9 world pixels, so the
      rich path could visibly freeze then jump after a hex commit.
    fix_sha: cf779e642c9620ed71bbb0ed713f0f2aa7c6c33d
    fix: use_any_nonzero_animation_displacement_in_window_render_paths

final_human_validation:
  result: accepted
  summary: >-
    Movement became materially more continuous. Most motion is smooth; small
    non-uniform residual judder remains visible on close inspection and was
    accepted. User reported the archer subjectively showed more residual judder
    than cavalry, but no type-specific animation-speed difference was established,
    so this was not promoted to a performance conclusion.

