headline:
  problem_signature: whole Runtime/World or monolithic mutable Resource prevents scheduler overlap
  root_cause: broad access hides actual disjoint work; real ordering/structural/error edges also exist
  resolution: choose serial Statistics leaf extraction and cost subdivision first
  result: disjoint narrow Systems overlap2; conflict/exclusive cases1; subset100/5000 and ordered5000 pass
revisit_when:
  - real independent compute savings exceed measured dispatch/gather/ordered-commit costs
  - high-active/high-dirty profiles materially change canonical costs
  - writer, component, structural boundary, cache policy or error semantics changes
