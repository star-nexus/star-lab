replay:
  environment_command: "STAR_SCALE_HARNESS_SOCKET=/tmp/star-scale.sock uv run rotk_env/main.py --skip-start --scenario TestMap-8K-scale-5000 --mode real_time --players human_vs_two_ai --seed 42 --no-hub --profile"
  density_point_shape: "uv run tools/scale_driver.py --socket /tmp/star-scale.sock density-point --density <d> --seed 42 --target-radius 12 --duration 20 --phase staggered --require-fog on --warmup 5 --sample-after 10 --output <file>.json"
