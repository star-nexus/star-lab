headline:
  problem_signature: "RenderEngine consumed about 5.5 ms/frame while display_present was already measured separately."
  root_cause: "About 81% of normal RenderEngine time was causally attributable to Fog full-window Surface presentation and Terrain cropped Surface presentation, not Python queue packing."
  resolution: "Stop optimizing queue packing; split the frontier into independent Fog and Terrain presentation cases."
  result: "Fog suppression removed ~3.04 ms from batch_blits; Terrain suppression removed ~1.37 ms from scalar_execute; direct attributable cost was ~4.41 ms."

revisit_when:
  - render queue topology changes materially
  - renderer backend changes away from Pygame/SDL software Surface submission
  - presentation cost ceases to dominate queue submission
