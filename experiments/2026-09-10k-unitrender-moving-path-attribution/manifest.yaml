trigger:
  post_d1_frontier_decision: FRONTIER_NOT_ESTABLISHED
  full_motion_p99_ms: [32.926, 33.348, 33.764]
  worst_headroom_ms: -0.434
  phase5_baseline_unitrender_delta_0_to_100_ms: 2.835
  recent_unitrender_delta_0_to_100_ms: 2.831
  classification: stable_movement_dependent_unitrender_signal

hypothesis:
  static_batch_path:
    grouping: committed_hex
    renderer: _render_unit_group_optimized
    max_rendered_entities_per_group: 6
  animated_batch_path:
    grouping: none
    renderer: _render_single_unit_fast_per_entity
  question: does_animation_collapse_aggregation_and_amplify_per_entity_render_work

semantic_boundary:
  committed_hex_is_not_visual_equivalence: true
  exact_pixel_key:
    - int_screen_x
    - int_screen_y
  exact_raster_key:
    - int_screen_x
    - int_screen_y
    - faction
    - unit_type
    - texture_size
    - current_count
    - max_count
  only_exact_raster_duplicates_can_trigger_dedup_candidate: true

scenario:
  name: chibi-144k-scale-10000
  sha256: e5bacb41c499fdfb9e91a917a1427515f2be1dae5ca4961692e921c05b816d25
  resident_units: 10000
  test_only_untracked_map: true

workload:
  points: [00pct-moving, 50pct-moving, 100pct-moving]
  seed: 42
  phase_seed: 42
  route_steps: 12
  phase: staggered
  fog: true
  gc_policy: realtime_defer
  minimap_dynamic_units: false
  render: uncapped
  hub: offline
  mock_ai: false

measurement:
  aggregate_frame_latency: diagnostic_only
  structure_sample_every_batch_frames: 16
  per_batch_frame:
    - visible_units
    - animated_units
    - static_units
    - static_hex_groups
    - static_fast_calls
    - animated_fast_calls
    - classification_ms
    - static_render_ms
    - animated_render_ms
    - texture_cache_hits
    - texture_cache_misses
  structural_sample:
    - animated_committed_hex_groups
    - animated_committed_static_cap_calls
    - animated_committed_reducible_calls
    - animated_committed_group_max
    - animated_pixel_duplicate_observations
    - animated_raster_duplicate_observations
    - animated_raster_duplicate_groups
    - animated_raster_group_max
  structural_ratios_use_sample_aligned_denominator: true

preregistered_attribution_decisions:
  candidate_priority:
    - EXACT_RASTER_DEDUP_CANDIDATE_JUSTIFIED
    - ANIMATED_SINGLE_PATH_DOMINANT_NEEDS_DECOMPOSITION
    - NO_MOVING_PATH_CANDIDATE
  all_point_guards_must_pass: true
  exact_raster_dedup:
    min_animated_render_ms_per_frame_50: 0.50
    min_animated_render_ms_per_frame_100: 1.00
    min_duplicate_ratio_50: 0.20
    min_duplicate_ratio_100: 0.20
    min_estimated_removable_ms_per_frame_50: 0.15
    min_estimated_removable_ms_per_frame_100: 0.50
  animated_path_dominant:
    min_animated_render_ms_per_frame_50: 0.50
    min_animated_render_ms_per_frame_100: 1.00
    action_if_true_without_exact_dedup: decompose_render_single_unit_fast_before_optimizing
  positive_attribution_is_not_production_keep: true

forbidden_during_attribution:
  - production_render_semantics_change
  - committed_hex_animation_collapse
  - texture_format_change
  - render_engine_submit_change
  - vision_change
  - animation_simulation_change
  - gc_change
  - native_parallel_rewrite

raw_mirror_pending: true
next_action: run_unitrender_moving_path_attribution

methodology:
  rule: "先证明 movement-dependent cost 是哪条路径造成的，再决定是否存在错误 multiplicity"
