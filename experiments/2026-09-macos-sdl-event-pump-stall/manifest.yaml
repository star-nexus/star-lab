root_cause: >-
  Rare long frames are dominated by SDL/Cocoa platform-event pumping inside
  pygame.event.pump(), not by Python queue draining or STAR EventBus dispatch.

mitigation:
  behavior: disable SDL text input during normal gameplay
  api: pygame.key.stop_text_input()
  effect: reduced unnecessary text/IME handling
  residual: rare platform pump tails may still occur even with text_input=false

