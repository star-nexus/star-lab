headline:
  problem_signature: "Rare ~50 ms-class tails coincide with a 30.896833 ms CPython cyclic-GC pause; Gen2 alone is 30.845625 ms and collected objects = 0."
  root_cause: "Automatic generation-2 cyclic GC can run unpredictably inside the latency-critical realtime loop, so profiler attribution lands on UnitRender even though the long pause is GC maintenance."
  resolution: "Perform a full Gen2 collection before the bounded realtime phase, temporarily disable automatic cyclic GC during that phase, then restore the prior GC state at deadline/safe point."
  result: "P99 48.815 -> 25.489 ms; UnitRender max 34.839 -> 7.103 ms."
