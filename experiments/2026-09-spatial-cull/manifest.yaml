headline:
  problem_signature: "Spatial candidate discovery existed, but per-candidate legacy ECS/singleton/coordinate work kept unit_visible_cull near 3.53 ms."
  root_cause: "Repeated candidate-level state lookup and coordinate work after the spatial prefilter, amplified by low-zoom overscan semantics."
