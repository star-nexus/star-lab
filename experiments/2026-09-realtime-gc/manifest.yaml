artifacts:
  formal: []
  backfill_status: "Original AUTO/realtime_defer formal JSON artifacts were not available when STAR Lab was initialized. Exact source provenance and validated numeric summaries are preserved; do not synthesize replacement raw data."

headline:
  problem_signature: "Rare ~50 ms-class frame/UnitRender tails coincide with a ~30.9 ms generation-2 CPython cyclic-GC pause inside the timed render call; collected objects = 0."
  root_cause: "Automatic generation-2 cyclic GC can run unpredictably inside the latency-critical realtime loop, so profiler attribution lands on UnitRender even though the long pause is GC maintenance."
  resolution: "Perform a full Gen2 collection before the bounded realtime measurement phase, temporarily disable automatic cyclic GC during that phase, then restore the caller's prior GC state at deadline/safe point."
  result: "P99 improved from 48.815 ms to 25.489 ms; max fell to 26.581 ms; UnitRender max fell from 34.839 ms to 7.103 ms."

revisit_when:
  - Python runtime or GC implementation changes materially
  - the realtime critical-window lifecycle changes
  - safe-point collection cost becomes operationally unacceptable
  - evidence shows cyclic garbage must be reclaimed within a bounded realtime phase
