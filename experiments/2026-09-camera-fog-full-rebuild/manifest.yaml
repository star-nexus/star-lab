headline:
  problem_signature: "Smooth geometry-key-visible camera motion caused an effectively per-frame Fog full rebuild; the original canonical short-pan tile loop was ~27.918 ms/rebuild for 8281 input tiles."
  root_cause: "Camera geometry-key invalidation correctly required a Fog rebuild, but the rebuild repeated expensive Python geometry for every camera-visible tile, including 1888 tiles whose final Fog alpha was transparent."
  resolution: "Keep full-rebuild semantics but fuse transform/bounds, precompute canonical corner offsets, cache camera-independent world corners, and bound presentation to actual Fog content so visible/no-Fog tiles skip all geometry."
  closeout: "Primary uninstrumented production Fog tile loop 13.983 ms/rebuild; full build 14.116 ms; residual EXPLAINED-WORKLOAD-BOUND."
  historical_supportive_result: "27.918 -> 13.983 ms/rebuild (-49.91%) across commits; supportive trajectory, not a same-commit A/B."

