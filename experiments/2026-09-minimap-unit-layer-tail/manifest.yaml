headline:
  problem_signature: 25% moving could cross the 16.67 ms controlled-work P99 budget despite closed historical bottlenecks
  root_cause: 15 Hz MiniMap dynamic-unit refresh cleared and rebuilt the unit layer by traversing all resident units, producing an approximately 4 ms O(N) periodic pulse
  resolution: exclude the auxiliary dynamic MiniMap unit layer from the Core 60Hz stress profile through an explicit scale-only override; preserve normal interactive default behavior
  result: 25% changes from approximately 16.81 ms P99 with MiniMap units ON to approximately 13.67 ms P99 with units OFF; 50% three-run median P99 is 16.68202856 ms and is retained as BORDERLINE ACCEPT

classification:
  strict_50pct: boundary_fail
  strict_reason: median controlled-work P99 16.68202856 ms is greater than literal 16.67 ms stress criterion
  engineering_disposition_50pct: BORDERLINE ACCEPT
  disposition_reason: approximately 0.012 ms / 0.07% over literal budget, repeatable steady workload, and no reopened historical pathology; exact binary frontier search intentionally stopped
  threshold_changed: false

revisit_when:
  - Full Interactive profile is required to sustain strict 60Hz at 5000+ resident units with dynamic MiniMap unit dots enabled
  - MiniMap unit rendering is redesigned as dirty-cell incremental or asynchronous derived-view work
  - resident population increases materially beyond 5000
  - the Core 60Hz stress criterion changes
  - raw artifacts or guard verification contradict the summarized measurements
