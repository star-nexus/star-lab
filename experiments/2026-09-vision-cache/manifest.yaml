headline:
  problem_signature: "4096-entry LRU saturates; epoch misses and evictions both reach 19010, hit rate falls to 72.39%, and Vision self time rises to 2.925 ms."
  root_cause: "4096 is below the active geometry working set and causes sustained LRU thrashing."
  resolution: "8192 is the measured minimum sufficient capacity; 16384 is the scale/window operational default for headroom without preallocation."
  result: "At 8192/16384, evictions are zero, hit rate is ~99.14%, final working set is 5639 entries, and Vision self time returns to ~1.22 ms."
