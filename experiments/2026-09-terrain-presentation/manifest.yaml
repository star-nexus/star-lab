headline:
  problem_signature: "Terrain presentation remained a ~1.37 ms scalar Surface hot path after Fog bounding."
  root_cause: "The dominant extra cost was Pygame/SDL SRCALPHA Surface software-blit semantics; large backing pitch/locality was secondary and flattening alpha values while retaining SRCALPHA was negligible."
  resolution: "Keep the oversized SRCALPHA overscan raster for construction, but build a compact display-format opaque RGB presentation cache at cache-install boundaries."
  result: "Production fixed-camera RenderEngine improved by ~0.889 ms (-26.7%); camera-stress RenderEngine improved by ~0.645 ms (-17.3%) without a new tail pathology."

closure:
  performance_validation: passed
  stress_validation: passed
  regression_test_evidence: pending_archive
  formal_closed: false

revisit_when:
  - renderer migrates away from Pygame/SDL software Surfaces
  - frame clear/background semantics change
  - viewport scale makes opaque-cache rebuild cost material
  - GPU-backed rendering is introduced
